[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "video-summary"
version = "0.1.2"
description = "Skill-local runtime for caption-first video acquisition and transcription."
requires-python = ">=3.12,<3.13"
dependencies = [
    # Production/runtime dependencies used by the bundled scripts.
    "av>=14",
    "faster-whisper>=1.2.1",
    "ctranslate2>=4.8.1,<5",
    "yt-dlp>=2025.1.1",
    # onnxruntime 1.29 dropped pre-macOS 14 wheels; keep both Intel and Apple
    # Silicon Macs installable while faster-whisper still supports this line.
    "onnxruntime>=1.23.2,<1.29; sys_platform == 'darwin'",
]

[dependency-groups]
# Development-only dependencies. Enable explicitly with `--group dev`.
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.uv]
default-groups = []
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
video-summary = "scripts.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.ruff]
line-length = 100
target-version = "py312"
